name: Rebuild site
# Asks GitHub Pages to republish the site whenever main changes
# (pushes made by apps don't always start a Pages build on their own).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
